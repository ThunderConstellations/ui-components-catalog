<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Component Data Verification - OmniUI Universe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .verify-container {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 1.5rem;
            padding: 3rem;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }
        .status-good {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
        }
        .status-warning {
            background: rgba(251, 146, 60, 0.1);
            border-color: rgba(251, 146, 60, 0.3);
        }
        .status-error {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
        }
        .status-info {
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.3);
        }
        .status-item {
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin: 1rem 0;
        }
        .status-item h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .status-item p {
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 0.75rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            padding: 0.75rem 2rem;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }
        .data-summary {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin: 1rem 0;
        }
        .data-summary h4 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }
        .stat-item {
            text-align: center;
            padding: 1rem;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 0.5rem;
        }
        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: #6366f1;
        }
        .stat-label {
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="verify-container">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Component Data Verification</h1>
            <p class="text-slate-400">Verifying UI component catalog integrity and accessibility</p>
        </div>

        <div id="verification-content">
            <div class="status-item status-info">
                <h3><i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Checking Component Data...</h3>
                <p>This will verify that all 1,366+ React & TypeScript UI components are properly loaded and accessible from the catalog.</p>
            </div>
        </div>

        <div class="text-center mt-8">
            <div class="btn-primary text-white inline-block">
                Loading verification results...
            </div>
        </div>
    </div>

    <script>
        // Component Data Verification Script
        async function verifyComponentData() {
            const verificationContent = document.getElementById('verification-content');
            
            const results = [];
            
            // Check 1: Try to fetch ui-components-data.json
            try {
                const response = await fetch('ui-components-data.json');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                results.push({
                    status: 'good',
                    title: '✅ Component Data File',
                    message: `Successfully loaded ${data.length} components from ui-components-data.json`,n                    details: [
                        `✅ File size: ${Math.round(response.headers.get('content-length') / 1024)}KB`,
                        `✅ Components count: ${data.length.toLocaleString()}`,
                        `✅ JSON structure: Valid`,
                        `✅ HTTP status: ${response.status}`
                    ].join('\n')
                });
            } catch (error) {
                results.push({
                    status: 'error',
                    title: '❌ Component Data File',
                    message: `Failed to load ui-components-data.json: ${error.message}`,
                    details: [
                        `🔧 Troubleshooting:`,
                        `   - Check network connection`,
                        `   - Clear browser cache`,
                        `   - Try refreshing the page`,
                        `   - If issue persists, try a different browser`
                    ].join('\n')
                });
            }
            
            // Check 2: Verify JSON structure
            try {
                const response = await fetch('ui-components-data.json');
                const data = await response.json();
                
                // Check for required fields
                const requiredFields = ['name', 'website', 'repo', 'license', 'category'];
                const sampleComponent = data[0];
                const missingFields = requiredFields.filter(field => !(field in sampleComponent));
                
                if (missingFields.length === 0) {
                    results.push({
                        status: 'good',
                        title: '✅ Data Structure',
                        message: `Component catalog structure is valid and complete`,
                        details: [
                            `✅ Required fields present: ${requiredFields.join(', ')}`,
                            `✅ Sample component name: ${sampleComponent.name}`,n                            `✅ Sample website: ${sampleComponent.website}`,
                            `✅ Sample repo: ${sampleComponent.repo}`,
                            `✅ Sample license: ${sampleComponent.license}`,
                            `✅ Sample category: ${sampleComponent.category}`
                        ].join('\n')
                    });
                } else {
                    results.push({
                        status: 'warning',
                        title: '⚠️ Data Structure Issues',
                        message: `Component catalog has missing fields in sample data`,
                        details: [
                            `Missing fields: ${missingFields.join(', ')}`,
                            `This may indicate data corruption or incomplete records`
                        ].join('\n')
                    });
                }
            } catch (error) {
                results.push({
                    status: 'error',
                    title: '❌ Data Structure Validation',
                    message: `Failed to validate component data structure: ${error.message}`,
                    details: `
                        🔧 Possible causes:
                        • ui-components-data.json file not found
                        • Invalid JSON syntax
                        • Server connection issues
                        • Browser security restrictions
                    `
                });
            }
            
            // Check 3: Component count and variety
            try {
                const response = await fetch('ui-components-data.json');
                const data = await response.json();
                
                const categories = [...new Set(data.map(c => c.category))];
                const withExamples = data.filter(c => c.code || c.website === 'https://example.com').length;
                
                results.push({
                    status: 'good',
                    title: '✅ Component Catalog Health',
                    message: `Catalog analysis completed successfully`,
                    details: [
                        `📊 Total components: ${data.length.toLocaleString()}`,
                        `📋 Unique categories: ${categories.length}`,
                        `🎯 Components with examples: ${withExamples.toLocaleString()}`,
                        `📈 Categories: ${categories.join(', ')}`
                    ].join('\n')
                });
            } catch (error) {
                results.push({
                    status: 'error',
                    title: '❌ Catalog Analysis Failed',
                    message: `Unable to analyze component catalog: ${error.message}`,
                    details: `
                        🔧 Check if:
                        • ui-components-data.json is accessible
                        • JSON is valid and properly formatted
                        • Browser supports modern JavaScript
                    `
                });
            }
            
            // Render results
            verificationContent.innerHTML = results.map(result => `
                <div class="status-item ${result.status}">
                    <h3>${result.title}</h3>
                    <p>${result.message}</p>
                    <pre class="text-xs font-mono text-slate-400 mt-2 whitespace-pre-wrap">${result.details}</pre>
                </div>
            `).join('');
            
            // Add summary section
            const goodCount = results.filter(r => r.status === 'good').length;
            const warningCount = results.filter(r => r.status === 'warning').length;
            const errorCount = results.filter(r => r.status === 'error').length;
            
            verificationContent.insertAdjacentHTML('beforeend', `
                <div class="data-summary mt-6">
                    <h4>📋 Verification Summary</h4>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value">${goodCount}</div>
                            <div class="stat-label">✅ Good</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${warningCount}</div>
                            <div class="stat-label">⚠️ Warning</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${errorCount}</div>
                            <div class="stat-label">❌ Error</div>
                        </div>
                    </div>
                </div>
                
                <div class="text-center mt-6">
                    <div class="btn-primary text-white">
                        🔄 Verify Again
                    </div>
                    <p class="text-sm text-slate-500 mt-2">
                        Last verified: ${new Date().toLocaleString()}
                    </p>
                </div>
            `);
        }

        // Initialize verification when page loads
        document.addEventListener('DOMContentLoaded', () => {
            verifyComponentData();
            
            // Add button functionality
            document.querySelector('.btn-primary')?.addEventListener('click', () => {
                verifyComponentData();
            });
        });
    </script>
</body>
</html>
