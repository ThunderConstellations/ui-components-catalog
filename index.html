<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Visual Similarity Search - 1,760+ Components</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .preview-frame { transition: width 0.3s ease; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">
    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-shapes text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">UI Visual Similarity Search</h1>
                    <p class="text-xs text-slate-400">Powered by Apple Vision Framework &amp; Catalog</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button id="openCompareModal" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-sm text-slate-300">
                    <i class="fa-solid fa-code-compare mr-2"></i> Compare Libraries
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Search Controls -->
        <section class="lg:col-span-1 space-y-6">
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <button id="searchBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>Run Visual Similarity Search</span>
                </button>
            </div>
            <!-- Favorites Sidebar -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h3 class="text-sm font-semibold text-slate-300 mb-4 flex items-center">
                    <i class="fa-solid fa-star mr-2 text-amber-400"></i> My Favorites
                </h3>
                <div id="favoritesList" class="space-y-3">
                    <p class="text-xs text-slate-500 italic">No favorites starred yet.</p>
                </div>
            </div>
        </section>

        <!-- Results -->
        <section class="lg:col-span-2 space-y-6">
            <div id="resultsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Example Result with Copy and Star -->
                <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 group" data-id="comp_101" data-name="Example Card">
                    <h4 class="text-sm font-semibold mb-2">Example Component</h4>
                    <div class="flex space-x-2">
                        <button onclick="openDemoModal('Example Comp', 'https://example.com')" class="text-xs bg-indigo-600 px-3 py-1.5 rounded-lg text-white">View Demo</button>
                        <button class="copy-btn bg-slate-800 hover:bg-indigo-600 text-slate-300 p-2 rounded-lg text-xs" title="Copy ID"><i class="fa-solid fa-copy"></i></button>
                        <button class="star-btn bg-slate-800 hover:bg-amber-600 text-slate-300 p-2 rounded-lg text-xs" title="Star Component"><i class="fa-solid fa-star"></i></button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Demo Modal -->
    <div id="demoModal" class="hidden fixed inset-0 bg-black/90 z-[100] flex flex-col items-center p-4">
        <div class="w-full max-w-6xl flex justify-between items-center mb-4 text-white">
            <h2 id="demoTitle" class="text-lg font-bold">Component Preview</h2>
            <div class="flex space-x-2">
                <button onclick="setViewport(375)" class="bg-slate-800 px-3 py-1 rounded text-xs">Mobile</button>
                <button onclick="setViewport(768)" class="bg-slate-800 px-3 py-1 rounded text-xs">Tablet</button>
                <button onclick="setViewport(1200)" class="bg-slate-800 px-3 py-1 rounded text-xs">Desktop</button>
                <button onclick="toggleDualTheme()" class="bg-indigo-600 px-3 py-1 rounded text-xs">Toggle Dual Theme</button>
                <button onclick="closeDemoModal()" class="text-slate-400">Close</button>
            </div>
        </div>
        <div id="previewWrapper" class="flex w-full justify-center space-x-4">
            <div id="previewFrame" class="preview-frame bg-white rounded-lg shadow-2xl overflow-hidden h-[70vh] w-[1200px]">
                <iframe id="demoIframe" src="" class="w-full h-full"></iframe>
            </div>
            <div id="darkPreviewFrame" class="hidden preview-frame bg-slate-950 rounded-lg shadow-2xl overflow-hidden h-[70vh] w-[1200px]">
                <iframe id="demoIframeDark" src="" class="w-full h-full"></iframe>
            </div>
        </div>
    </div>

    <!-- Compare Modal -->
    <div id="compareModal" class="hidden fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-3xl shadow-2xl">
            <h2 class="text-xl font-bold mb-4 text-white">Compare Libraries</h2>
            <div class="grid grid-cols-2 gap-4">
                <select id="lib1" class="bg-slate-950 border border-slate-800 p-2 rounded-lg text-white text-sm"></select>
                <select id="lib2" class="bg-slate-950 border border-slate-800 p-2 rounded-lg text-white text-sm"></select>
            </div>
            <div id="compareResults" class="mt-6 text-white text-sm"></div>
            <button onclick="closeCompareModal()" class="mt-6 bg-slate-800 px-4 py-2 rounded-lg text-white">Close</button>
        </div>
    </div>

    <script>
        // Favorites Logic
        function toggleFavorite(id, name) {
            let favorites = JSON.parse(localStorage.getItem('myFavorites') || '{}');
            if (favorites[id]) {
                delete favorites[id];
            } else {
                favorites[id] = { id, name };
            }
            localStorage.setItem('myFavorites', JSON.stringify(favorites));
            renderFavorites();
        }

        function renderFavorites() {
            const favoritesList = document.getElementById('favoritesList');
            const favorites = JSON.parse(localStorage.getItem('myFavorites') || '{}');
            if (Object.keys(favorites).length === 0) {
                favoritesList.innerHTML = '<p class="text-xs text-slate-500 italic">No favorites starred yet.</p>';
                return;
            }
            favoritesList.innerHTML = Object.values(favorites).map(comp => `
                <div class="bg-slate-800 p-2 rounded-lg text-xs text-white flex justify-between">
                    ${comp.name}
                    <button onclick="toggleFavorite('${comp.id}')" class="text-amber-400"><i class="fa-solid fa-star"></i></button>
                </div>
            `).join('');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', renderFavorites);

        // Copy Logic
        document.addEventListener('click', (e) => {
            if (e.target.closest('.copy-btn')) {
                const btn = e.target.closest('.copy-btn');
                const id = btn.closest('[data-id]').dataset.id;
                navigator.clipboard.writeText(id).then(() => {
                    const original = btn.innerHTML;
                    btn.innerHTML = '<i class="fa-solid fa-check"></i>';
                    setTimeout(() => btn.innerHTML = original, 1000);
                });
            }
            if (e.target.closest('.star-btn')) {
                const btn = e.target.closest('.star-btn');
                const card = btn.closest('[data-id]');
                toggleFavorite(card.dataset.id, card.dataset.name);
            }
        });

        // Modal Logic
        const demoModal = document.getElementById('demoModal');
        const compareModal = document.getElementById('compareModal');
        
        function openDemoModal(title, url) {
            document.getElementById('demoTitle').textContent = title;
            document.getElementById('demoIframe').src = url;
            document.getElementById('demoIframeDark').src = url;
            demoModal.classList.remove('hidden');
        }
        function closeDemoModal() { demoModal.classList.add('hidden'); }
        
        function setViewport(width) {
            document.getElementById('previewFrame').style.width = width + 'px';
            document.getElementById('darkPreviewFrame').style.width = width + 'px';
        }
        
        function toggleDualTheme() {
            document.getElementById('darkPreviewFrame').classList.toggle('hidden');
        }

        function openCompareModal() { compareModal.classList.remove('hidden'); }
        function closeCompareModal() { compareModal.classList.add('hidden'); }
    </script>
</body>
</html>
